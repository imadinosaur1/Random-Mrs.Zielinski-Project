<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadratic Transformations</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    body {
      max-width: 700px;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 1.1rem/1.6 system-ui, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      padding: 2rem;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 4px 20px #17203318;
    }

    button {
      display: block;
      width: 100%;
      margin: 0.75rem 0;
      padding: 0.9rem;
      border: 1px solid #9aa8bd;
      border-radius: 0.6rem;
      background: white;

  <div id="screen-container"></div>

  <!-- Shared systems -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/router.js"></script>

  <!-- Reusable components -->
  <script src="components/sprites.js"></script>
  <script src="components/graph.js"></script>
  <script src="components/lesson-screen.js"></script>
  <script src="components/choice-card.js"></script>

  <!-- Scenes -->
  <script src="scenes/branch-intro/intro.js"></script>
  <script src="scenes/branch-hub/hub.js"></script>
  <script src="scenes/branch-horizontal-shift/horizontal.js"></script>
  <script src="scenes/branch-vertical-shift/vertical.js"></script>
  <script src="scenes/branch-stretch/stretch.js"></script>

  <script src="scenes/branch-reflection/reflection.js"></script>

  <script>
    Router.navigate("intro");
